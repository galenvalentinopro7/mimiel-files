<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            background: #121212;
            color: #888;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-container {
            width: 95%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 4px;
            padding: 20px;
        }

        .image-container img {
            width: 100%;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .image-container img:hover {
            opacity: 1;
        }

        h2 {
            font-weight: 100;
            font-size: 1.2rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<h2>mimiel_final_v2_actualfinal.dmg</h2>

<div id="imageContainer" class="image-container"></div>

<script>
    const data = [
 "https://media.discordapp.net/attachments/1447865920000360511/1475823065177788486/mimiel_files_page_10b.png?ex=699ee2d6&is=699d9156&hm=46766a128b2a57e464ad84f9512553c9582db03ac180b8bdbaa2263297fc6408&=&format=webp&quality=lossless&width=827&height=465",
        "https://media.discordapp.net/attachments/1447865920000360511/1475823065819779134/mimiel_files_page_1m.png?ex=699ee2d6&is=699d9156&hm=5416391485086072c2591dde33988f172e510f426490ffc43a0d96fcec4bc91c&=&format=webp&quality=lossless&width=820&height=465",
        "https://media.discordapp.net/attachments/1447865920000360511/1475823066482475058/mimiel_files.png?ex=699ee2d6&is=699d9156&hm=7c143d6955b006d5b74b4bde014e1b9bddf0e97968ecac662fb059ea65c357ca&=&format=webp&quality=lossless&width=705&height=465"
    ];

    const view = document.getElementById("imageContainer");

    const sync = () => {
        view.innerHTML = data.map(i => `<img src="${i}">`).join('');
    };

    sync();

    setInterval(() => {
        if (view.children.length !== data.length) sync();
    }, 5000);
</script>

</body>
</html>
